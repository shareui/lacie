name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: lacie-linux-gnu-x86_64
            use_cross: false

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: lacie-linux-gnu-aarch64
            use_cross: true

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: lacie-linux-musl-x86_64
            use_cross: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: lacie-linux-musl-aarch64
            use_cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: lacie-macos-x86_64
            use_cross: false

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: lacie-macos-aarch64
            use_cross: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: lacie-windows-msvc-x86_64.exe
            use_cross: false

          - target: x86_64-unknown-freebsd
            os: ubuntu-latest
            artifact_name: lacie-freebsd-x86_64
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build target (cross)
        if: matrix.use_cross
        run: cross build --target ${{ matrix.target }} --release

      - name: Build target (cargo)
        if: "!matrix.use_cross"
        run: cargo build --target ${{ matrix.target }} --release

      - name: Prepare binary asset (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          cp target/${{ matrix.target }}/release/lacie ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Prepare binary asset (Windows)
        if: contains(matrix.target, 'windows')
        run: |
          Copy-Item target/${{ matrix.target }}/release/lacie.exe -Destination ${{ matrix.artifact_name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  build-openbsd:
    name: Build OpenBSD x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: |
            pkg_add rust
            cargo build --release
            cp target/release/lacie lacie-openbsd-x86_64
            chmod +x lacie-openbsd-x86_64

      - name: Upload OpenBSD artifact
        uses: actions/upload-artifact@v4
        with:
          name: lacie-openbsd-x86_64
          path: lacie-openbsd-x86_64
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-openbsd]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release_binaries
          merge-multiple: true

      - name: Verify release assets
        run: ls -la release_binaries/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release_binaries/*
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
